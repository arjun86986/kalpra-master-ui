<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kalpra - Production Ready Landing Page</title>
    <base href="/" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Meta Tags (will be updated by SeoService) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Modern, scalable Angular 21 landing page with Signals and Standalone Components"
    />
    <meta name="theme-color" content="#4A90E2" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Preload critical resources -->
    <link rel="preload" as="style" href="styles.css" />

    <!-- Performance: Prefetch DNS for analytics -->
    <link rel="dns-prefetch" href="//www.google-analytics.com" />
  </head>

    <app-root id="main-content" role="main"></app-root>
