<section class="enterprise-cards" id="enterprise" aria-labelledby="enterprise-cards-heading">
  <div class="enterprise-cards__inner" appScrollReveal="fade-up">
    <header class="enterprise-cards__header">
      <p class="enterprise-cards__eyebrow">Enterprise</p>
      <h2 id="enterprise-cards-heading">Built for scale and clarity</h2>
      <p class="enterprise-cards__desc">Executive visibility without the overhead.</p>
    </header>

    <div class="enterprise-cards__grid">
      <article
        class="enterprise-card"
        *ngFor="let card of cards; let i = index"
        [class.enterprise-card--expanded]="expandedId() === i"
        appScrollReveal="scale"
        [revealDelay]="i * 60"
        (mouseenter)="expandedId.set(i)"
        (mouseleave)="expandedId.set(null)"
      >
        <div class="enterprise-card__top">
          <span class="enterprise-card__badge" [ngClass]="'enterprise-card__badge--' + card.accent">{{ card.badge }}</span>
          <button
            class="enterprise-card__toggle"
            type="button"
            [attr.aria-expanded]="expandedId() === i"
            [attr.aria-label]="(expandedId() === i ? 'Collapse' : 'Expand') + ' ' + card.title"
            (click)="toggleCard(i)"
          >
            {{ expandedId() === i ? '−' : '+' }}
          </button>
        </div>

        <h3>{{ card.title }}</h3>
        <p>{{ card.description }}</p>

        <div class="enterprise-card__details" *ngIf="expandedId() === i">
          <ul>
            <li *ngFor="let metric of card.metrics">{{ metric }}</li>
          </ul>
        </div>
      </article>
    </div>
  </div>
</section>
