<section class="testimonials-slider" id="testimonials" aria-labelledby="testimonials-slider-heading">
  <div class="testimonials-slider__inner" appScrollReveal="fade-up">
    <header class="testimonials-slider__header">
      <p class="testimonials-slider__eyebrow">Customers</p>
      <h2 id="testimonials-slider-heading">Trusted by engineering leaders</h2>
    </header>

    <div class="testimonial-card" *ngIf="testimonials[activeIndex()] as testimonial" appScrollReveal="fade-in">
      <div class="testimonial-card__media">
        <div class="testimonial-card__logo">{{ testimonial.company }}</div>
        <div class="testimonial-card__avatar" aria-hidden="true">{{ testimonial.avatar }}</div>
      </div>

      <div class="testimonial-card__body">
        <div class="testimonial-card__stars" role="img" [attr.aria-label]="testimonial.rating + ' out of 5 stars'">
          <span *ngFor="let star of [1,2,3,4,5]" aria-hidden="true">★</span>
        </div>

        <blockquote>
          <p>"{{ testimonial.quote }}"</p>
          <footer class="testimonial-card__person">
            <cite>
              <strong>{{ testimonial.name }}</strong>
              <span>{{ testimonial.role }}</span>
            </cite>
          </footer>
        </blockquote>
      </div>
    </div>

    <div class="testimonials-slider__controls">
      <button type="button" class="testimonials-slider__nav" (click)="previous()" aria-label="Previous testimonial">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
      </button>

      <div class="testimonials-slider__dots" role="tablist" aria-label="Testimonial navigation">
        <button
          *ngFor="let t of testimonials; let i = index"
          type="button"
          role="tab"
          class="testimonials-slider__dot"
          [class.is-active]="activeIndex() === i"
          [attr.aria-selected]="activeIndex() === i"
          [attr.aria-label]="'Testimonial ' + (i + 1) + ' from ' + t.company"
          (click)="goTo(i)"
        ></button>
      </div>

      <button type="button" class="testimonials-slider__nav" (click)="next()" aria-label="Next testimonial">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
      </button>
    </div>
  </div>
</section>
