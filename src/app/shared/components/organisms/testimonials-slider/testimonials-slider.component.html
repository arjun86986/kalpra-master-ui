<section class="testimonials-slider" aria-labelledby="testimonials-slider-heading">
  <div class="testimonials-slider__header">
    <div>
      <p class="testimonials-slider__eyebrow">Testimonials</p>
      <h2 id="testimonials-slider-heading">Trusted by engineering leaders building at scale</h2>
    </div>
  </div>

  <div class="testimonial-card" *ngIf="testimonials[activeIndex()] as testimonial">
    <div class="testimonial-card__media">
      <div class="testimonial-card__logo">{{ testimonial.company }}</div>
      <div class="testimonial-card__avatar">{{ testimonial.avatar }}</div>
    </div>

    <div class="testimonial-card__body">
      <div class="testimonial-card__stars" aria-label="5 star rating">
        <span *ngFor="let star of [1,2,3,4,5]">★</span>
      </div>

      <blockquote>“{{ testimonial.quote }}”</blockquote>

      <div class="testimonial-card__person">
        <strong>{{ testimonial.name }}</strong>
        <span>{{ testimonial.role }}</span>
      </div>
    </div>
  </div>

  <div class="testimonials-slider__controls">
    <button type="button" (click)="previous()" aria-label="Previous testimonial">←</button>
    <button type="button" (click)="next()" aria-label="Next testimonial">→</button>
  </div>
</section>
