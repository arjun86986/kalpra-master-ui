<section class="dashboard-cards" id="metrics" aria-labelledby="dashboard-cards-heading">
  <div class="dashboard-cards__inner" appScrollReveal="fade-up">
    <header class="dashboard-cards__header">
      <div>
        <p class="dashboard-cards__eyebrow">Operational Intelligence</p>
        <h2 id="dashboard-cards-heading">Live engineering pulse</h2>
        <p class="dashboard-cards__desc">Real-time metrics across your entire delivery stack.</p>
      </div>
    </header>

    <div class="dashboard-cards__grid">
      <article
        class="card"
        *ngFor="let card of cards; let i = index"
        appScrollReveal="fade-up"
        [revealDelay]="i * 60"
      >
        <div class="card__top">
          <div>
            <h3>{{ card.title }}</h3>
            <p>{{ card.detail }}</p>
          </div>
          <span class="card__badge" [ngClass]="'card__badge--' + card.accent">{{ card.value }}</span>
        </div>

        <div class="card__chart" aria-hidden="true">
          <span *ngFor="let point of card.chart" [style.height.%]="point"></span>
        </div>

        <div class="card__footer">
          <div class="card__progress" role="progressbar" [attr.aria-valuenow]="card.progress" aria-valuemin="0" aria-valuemax="100">
            <div class="card__progress-bar" [style.width.%]="card.progress"></div>
          </div>
          <span class="card__progress-label">{{ card.progress }}%</span>
        </div>
      </article>
    </div>
  </div>
</section>
