<section class="pricing-cards" id="pricing" aria-labelledby="pricing-cards-heading">
  <div class="pricing-cards__inner" appScrollReveal="fade-up">
    <header class="pricing-cards__header">
      <div>
        <p class="pricing-cards__eyebrow">Pricing</p>
        <h2 id="pricing-cards-heading">Plans that scale with you</h2>
        <p class="pricing-cards__desc">Start free. Upgrade when you're ready.</p>
      </div>

      <div class="pricing-cards__toggle" role="tablist" aria-label="Billing period">
        <button
          type="button"
          role="tab"
          class="pricing-cards__toggle-btn"
          [class.is-active]="billingMode() === 'monthly'"
          [attr.aria-selected]="billingMode() === 'monthly'"
          (click)="toggleBilling('monthly')"
        >
          Monthly
        </button>
        <button
          type="button"
          role="tab"
          class="pricing-cards__toggle-btn"
          [class.is-active]="billingMode() === 'annual'"
          [attr.aria-selected]="billingMode() === 'annual'"
          (click)="toggleBilling('annual')"
        >
          Annual
          <span class="pricing-cards__save">−20%</span>
        </button>
      </div>
    </header>

    <div class="pricing-cards__grid">
      <article
        class="pricing-card"
        *ngFor="let tier of tiers; let i = index"
        [class.pricing-card--featured]="tier.featured"
        appScrollReveal="fade-up"
        [revealDelay]="i * 80"
      >
        <div class="pricing-card__top">
          <h3>{{ tier.name }}</h3>
          <span class="pricing-card__badge" *ngIf="tier.featured">Popular</span>
        </div>

        <p class="pricing-card__description">{{ tier.description }}</p>

        <div class="pricing-card__price">
          <strong>{{ billingMode() === 'monthly' ? tier.monthlyPrice : tier.annualPrice }}</strong>
          <span>/mo</span>
        </div>

        <ul class="pricing-card__features">
          <li *ngFor="let feature of tier.features">{{ feature }}</li>
        </ul>

        <button class="pricing-card__cta" [class.pricing-card__cta--featured]="tier.featured" type="button">
          Get Started
        </button>
      </article>
    </div>
  </div>
</section>
