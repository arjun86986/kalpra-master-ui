<section class="feature-cards" id="platform" aria-labelledby="feature-cards-heading">
  <div class="feature-cards__inner" appScrollReveal="fade-up">
    <header class="feature-cards__header">
      <p class="feature-cards__eyebrow">Platform</p>
      <h2 id="feature-cards-heading">Everything to ship with clarity</h2>
      <p class="feature-cards__desc">One platform. Every signal. Zero noise.</p>
    </header>

    <div class="feature-cards__grid">
      <article
        class="feature-card"
        *ngFor="let card of cards; let i = index"
        appScrollReveal="fade-up"
        [revealDelay]="i * 50"
      >
        <div class="feature-card__icon" [ngClass]="'feature-card__icon--' + card.accent" aria-hidden="true">
          {{ card.icon }}
        </div>
        <h3>{{ card.title }}</h3>
        <p>{{ card.description }}</p>
      </article>
    </div>
  </div>
</section>
