<section class="process-timeline" id="process" aria-labelledby="process-timeline-heading">
  <div class="process-timeline__inner" appScrollReveal="fade-up">
    <header class="process-timeline__header">
      <p class="process-timeline__eyebrow">How it works</p>
      <h2 id="process-timeline-heading">From signal to action</h2>
      <p class="process-timeline__desc">Four steps. Zero friction.</p>
    </header>

    <div class="process-timeline__layout">
      <div class="process-timeline__svg" aria-hidden="true" appScrollReveal="fade-right">
        <svg viewBox="0 0 400 300" role="presentation">
          <defs>
            <linearGradient id="path-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(108, 92, 231, 0.8)" />
              <stop offset="100%" stop-color="rgba(0, 212, 255, 0.8)" />
            </linearGradient>
          </defs>
          <path d="M40 200 C120 200, 140 100, 200 100 S280 200, 360 200" fill="none" stroke="url(#path-gradient)" stroke-width="2" stroke-dasharray="6 4" />
          <circle cx="40" cy="200" r="6" fill="#6C5CE7" />
          <circle cx="200" cy="100" r="6" fill="#7C4DFF" />
          <circle cx="360" cy="200" r="6" fill="#00D4FF" />
        </svg>
      </div>

      <div class="process-timeline__steps">
        <article
          class="step"
          *ngFor="let step of steps; let i = index"
          appScrollReveal="fade-left"
          [revealDelay]="i * 80"
        >
          <div class="step__index" [ngClass]="'step__index--' + step.accent">{{ i + 1 }}</div>
          <div class="step__content">
            <h3>{{ step.title }}</h3>
            <p>{{ step.description }}</p>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
