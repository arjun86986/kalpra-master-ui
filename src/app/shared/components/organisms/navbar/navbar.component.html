<nav
  class="navbar"
  role="navigation"
  aria-label="Main navigation"
  [class.navbar--scrolled]="isScrolled()"
  [class.navbar--mobile-menu-open]="isMenuOpen() && isMobile()"
>
  <div class="navbar-container">
    <div class="navbar-logo">
      <a href="#hero" class="logo-link" (click)="scrollToTop($event)" aria-label="Kalpra home">
        <div class="logo-icon" aria-hidden="true">K</div>
        <span class="logo-text">KALPRA</span>
      </a>
    </div>

    <div class="navbar-menu" [class.navbar-menu--open]="isMenuOpen()">
      <ul class="navbar-links">
        <li *ngFor="let link of navLinks" class="navbar-link-item">
          <a
            [href]="link.href"
            class="navbar-link"
            [class.navbar-link--active]="isActive(link.sectionId)"
            [attr.aria-current]="isActive(link.sectionId) ? 'true' : null"
            (click)="onNavClick($event, link)"
          >
            {{ link.label }}
          </a>
        </li>
      </ul>

      <div class="navbar-actions">
        <a href="#contact" class="btn-premium-ghost" (click)="onNavClick($event, { label: 'Contact', href: '#contact', sectionId: 'contact' })">
          Contact
        </a>
        <a href="#pricing" class="btn-premium-primary navbar-btn-demo" (click)="onNavClick($event, { label: 'Pricing', href: '#pricing', sectionId: 'pricing' })">
          Get Started
        </a>
      </div>
    </div>

    <button
      class="navbar-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="navbar-menu"
    >
      <span class="hamburger" [class.hamburger--active]="isMenuOpen()">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </span>
    </button>
  </div>
</nav>
