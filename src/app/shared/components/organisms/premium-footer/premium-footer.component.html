<footer class="premium-footer" id="contact" appScrollReveal="fade-up">
  <div class="premium-footer__inner">
    <div class="premium-footer__content">
      <div class="premium-footer__brand">
        <div class="premium-footer__logo" aria-hidden="true">K</div>
        <div>
          <h2 class="premium-footer__title">Kalpra</h2>
          <p>Engineering intelligence, powered by AI.</p>
        </div>
      </div>

      <div class="premium-footer__newsletter">
        <h3>Stay in the loop</h3>
        <p>Product updates and engineering insights.</p>
        <form class="premium-footer__form" (submit)="$event.preventDefault()">
          <label for="footer-email" class="sr-only">Email address</label>
          <input id="footer-email" type="email" placeholder="you@company.com" autocomplete="email" required />
          <button type="submit" class="btn-premium-primary">Subscribe</button>
        </form>
      </div>

      <nav class="premium-footer__social" aria-label="Social links">
        <h3>Follow</h3>
        <div class="premium-footer__links">
          <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://x.com" target="_blank" rel="noopener noreferrer">X</a>
        </div>
      </nav>
    </div>

    <div class="premium-footer__bottom">
      <span>© 2026 Kalpra</span>
      <div class="premium-footer__legal">
        <a href="#privacy">Privacy</a>
        <a href="#terms">Terms</a>
      </div>
    </div>
  </div>
</footer>
